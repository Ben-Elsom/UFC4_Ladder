<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>UFC 4 Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eeeff2; --side: #f6f7f9; --panel: #ffffff; --panel-2: #f3f4f6; --head: #fafbfc; --ink: #14161a; --ink-2: #2b2f36;
  --muted: #6b7280; --line: #e6e8ec; --line-2: #eef0f3; --border: #d9dce2;
  --accent: #6d3be8; --accent-soft: #f4efff; --accent-2: #b57bff; --brand-a: #e3008c; --brand-b: #8a2be2; --nav-on: #c2187a;
  --green: #14915f; --green-soft: #e3f5ec; --red: #d92d3a; --red-soft: #fdecee; --amber: #a35c00; --amber-soft: #fbe8cc;
  --gold: #e3a008; --card-tint: #fff4f8; --card-line: #ecdde6;
  --r1: #fff7d6; --r1b: #fffdf3; --r2: #eef0f3; --r2b: #f8f9fa; --r3: #ffe9e0; --r3b: #fff7f3;
  --shadow: 0 1px 3px rgba(16,24,40,.08);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.app { display: flex; min-height: 100vh; }

/* sidebar */
.side { width: 256px; flex: none; background: var(--side); padding: 24px 14px; border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; font-weight: 700; font-size: 16px; }
.hex { width: 30px; height: 30px; flex: none; background: linear-gradient(135deg, var(--brand-a), var(--brand-b)); clip-path: polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); display: flex; align-items: center; justify-content: center; }
.hex i { width: 12px; height: 12px; background: #fff; clip-path: inherit; }
.grp { font-size: 13px; color: var(--muted); padding: 14px 12px 6px; }
nav#tabs { display: contents; }
.nv { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid transparent; border-radius: 12px; background: none; color: var(--ink-2); font-size: 15px; cursor: pointer; text-align: left; margin-bottom: 2px; }
.nv:hover { background: var(--panel-2); }
.nv.on { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
.nv.on svg { stroke: var(--nav-on); }
.badge { margin-left: auto; font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 7px; font-weight: 600; }
.note { margin: 26px 4px 0; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; line-height: 1.5; color: var(--muted); }
.note b { color: var(--ink); }
.side .foot { margin-top: auto; padding: 0 12px; font-size: 12px; color: var(--muted); }

/* main */
.main { flex: 1; min-width: 0; background: var(--panel); margin: 14px 14px 14px 0; border-radius: 18px; padding: 30px 34px 40px; border: 1px solid var(--line); }
h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
h2 { font-size: 19px; font-weight: 600; margin: 28px 0 12px; letter-spacing: -.01em; }
h3 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
.flt { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 9px; padding: 7px 13px; font-size: 14.5px; color: var(--ink-2); background: var(--panel); cursor: pointer; }
.flt.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.up { color: var(--green); } .down, .dn { color: var(--red); }

/* highlight cards */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 28px; }
.st { border: 1px solid var(--card-line); border-radius: 14px; padding: 16px 18px; background: linear-gradient(135deg, var(--panel) 60%, var(--card-tint)); min-width: 0; }
.st .h { font-size: 14.5px; color: var(--ink-2); margin-bottom: 14px; }
.st .row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.st .who { flex: 1; min-width: 0; }
.st .who b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.st .big { font-size: 21px; color: var(--accent); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.st .bar { height: 5px; background: var(--line-2); border-radius: 9px; margin-top: 12px; }
.st .bar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.st .num { font-size: 26px; letter-spacing: -.01em; }
.ring { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex: none; }
.pair { display: flex; flex: none; } .pair .av + .av { margin-left: -10px; box-shadow: 0 0 0 2px var(--panel); }

/* avatars, badges */
.av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: #fff; flex: none; }
.av.s { width: 34px; height: 34px; font-size: 12px; }
.hx { width: 34px; height: 34px; flex: none; clip-path: polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 14px; }
.hx.g1 { background: linear-gradient(135deg, #ffd66b, #f5a623); } .hx.g2 { background: linear-gradient(135deg, #d5d9e0, #a3aab6); } .hx.g3 { background: linear-gradient(135deg, #ffa585, #ee6a45); }
.rk { width: 34px; flex: none; text-align: center; font-size: 19px; color: var(--muted); }
.mv { font-size: 13.5px; white-space: nowrap; min-width: 34px; }
.tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.pill.red { background: var(--red-soft); color: var(--red); } .pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); } .pill.gold { background: var(--r1); color: var(--gold); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 24px; } .bars i { width: 3px; border-radius: 2px; background: var(--accent); }
.name { cursor: pointer; font-weight: 500; } .name:hover { color: var(--accent); }

/* tables (grid rows) */
.tbl { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tr { display: grid; align-items: center; gap: 12px; padding: 0 20px; min-height: 64px; border-top: 1px solid var(--line-2); font-size: 14.5px; }
.tr.th { min-height: 44px; background: var(--head); color: var(--muted); font-size: 13px; border-top: 0; }
.tr.r1 { background: linear-gradient(90deg, var(--r1), var(--r1b) 60%, var(--panel)); }
.tr.r2 { background: linear-gradient(90deg, var(--r2), var(--r2b) 60%, var(--panel)); }
.tr.r3 { background: linear-gradient(90deg, var(--r3), var(--r3b) 60%, var(--panel)); }
.cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cell .t { min-width: 0; } .cell .t > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.rankcols { grid-template-columns: 96px minmax(0, 1.6fr) 100px 80px 90px minmax(0, 1fr) 110px; }
.combcols { grid-template-columns: 96px minmax(0, 1.6fr) 100px 90px 90px 80px; }
.provcols { grid-template-columns: minmax(0, 1.6fr) 100px 80px 120px 110px; }
.fightcols { grid-template-columns: 56px minmax(0, 1.9fr) 120px 70px 130px 110px; }
.h2hcols { grid-template-columns: minmax(0, 1.5fr) 130px 70px 90px; }
.sec { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; } .sec b { font-size: 18px; font-weight: 600; }

/* lists for phones */
.list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line-2); }
.lrow:first-child { border-top: 0; }
.lrow .t { flex: 1; min-width: 0; } .lrow .t > * { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .r { text-align: right; flex: none; }
.lrow.r1 { background: linear-gradient(90deg, var(--r1), var(--panel)); } .lrow.r2 { background: linear-gradient(90deg, var(--r2), var(--panel)); } .lrow.r3 { background: linear-gradient(90deg, var(--r3), var(--panel)); }
.mob { display: none; }

/* fighter page */
.fhead { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.fhead .av { width: 72px; height: 72px; font-size: 24px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 24px 0; }
.kpis .st .h { margin-bottom: 6px; } .kpis .v { font-size: 24px; font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding-top: 4px; }
.chart div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.chart span { font-size: 10.5px; color: var(--muted); }
.chart i { width: 100%; max-width: 24px; border-radius: 6px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
.box { border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
select { font: 500 15px Inter, sans-serif; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel); color: var(--ink); max-width: 100%; }

/* how to use + review (carried over) */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font: 600 12px Inter, sans-serif; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
td { padding: 10px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
code, .msg { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel-2); padding: 2px 6px; border-radius: 5px; }
.msg { display: block; padding: 8px 10px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
.examples { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; align-items: center; }
.tut p, .tut li { max-width: 72ch; }
.tut li { margin: 5px 0; }
.fight { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.fight:last-child { border-bottom: 0; }
.fid { color: var(--muted); font-size: 13px; }
.banner { border-radius: 10px; padding: 10px 14px; margin: 0 0 16px; font-weight: 500; }
.banner.amber { background: var(--amber-soft); color: var(--amber); } .banner.red { background: var(--red-soft); color: var(--red); }
.empty { color: var(--muted); padding: 18px; }
details summary { cursor: pointer; color: var(--muted); font-weight: 600; margin: 12px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 1180px) {
  .side { width: 220px; }
  .main { padding: 26px 24px 36px; }
  .rankcols { grid-template-columns: 90px minmax(0, 1.6fr) 90px 70px 80px 110px; } .rankcols .form { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { display: block; }
  .side { position: sticky; z-index: 5; width: auto; height: auto; padding: 12px 16px 10px; border-right: 0; border-bottom: 1px solid var(--line); flex-direction: column; overflow: hidden; }
  .side > * { min-width: 0; }
  .logo { padding: 0 0 10px; justify-content: space-between; }
  .grp, .note { display: none; }
  .side .foot { display: none; }
  .navrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .nv { width: auto; flex: none; padding: 7px 12px; font-size: 14px; white-space: nowrap; margin: 0; }
  .nv svg { display: none; }
  .main { margin: 0; border: 0; border-radius: 0; padding: 18px 16px 40px; }
  .desk { display: none; } .mob { display: block; }
  .stats { grid-template-columns: 1fr; gap: 10px; margin-bottom: 22px; }
  .two { grid-template-columns: 1fr; }
  .examples { grid-template-columns: 1fr; } .examples div:nth-child(even) { margin-bottom: 8px; }
  .filters { margin: 14px 0 16px; gap: 8px; }
  h1 { font-size: 24px; }
}
@media (min-width: 901px) { .navrow { display: contents; } .logo .upd { display: none; } }
@media (max-width: 420px) { .kpis { gap: 10px; } .kpis .v { font-size: 20px; } .st { padding: 14px 16px; } }
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const h = Math.round(m / 60); if (h < 24) return `${h}h ago`;
  const d = Math.round(h / 24); if (d < 30) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
};

    let h = '';
    const days = M.login_days_left;
    h += `<h2 style="margin-top:0">Bot status</h2><div class="card"><table><tbody>
      <tr><td>Last checked the chat</td><td class="num">${M.last_run ? ago(M.last_run) : 'never'}</td></tr>
      <tr><td>Posting in chat</td><td class="num">${M.dry_run ? '<span class="pill amber">Test mode, not posting</span>' : '<span class="pill green">On</span>'}</td></tr>
      <tr><td>PlayStation login</td><td class="num">${M.status === 'login_failed' ? '<span class="pill red">Expired</span>' : days != null ? `${Math.max(0, Math.round(days))} days left` : '–'}</td></tr>
      ${M.status === 'error' ? `<tr><td>Last error</td><td class="num"><span class="pill red">${esc(M.error)}</span></td></tr>` : ''}
    </tbody></table></div>`;
    const open = D.review.filter(r => !r.resolved);
    const disputed = D.fights.filter(f => f.status === 'disputed');
    h += `<h2>Needs review</h2>`;
    if (!open.length && !disputed.length) h += `<div class="card empty">Nothing to check. 👌</div>`;
    if (disputed.length) h += `<h3>Paused results</h3><div class="card">${disputed.map(fightRow).join('')}</div>`;
    const issue = r => { const s = r.reason || '';
      if (/which mode/.test(s)) return 'No mode';
      if (/who it was against/.test(s)) return 'No opponent';
      if (/which player/.test(s)) return 'Unclear opponent';
      if (/two different/i.test(s)) return "Results don't match";
      const m = s.match(/Couldn't work out who "(.*)" is/); if (m) return `Unknown player: "${m[1]}"`;
      return s; };
    if (open.length) h += `<h3>Flagged messages</h3>` + open.map(r => `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(issue(r))}</b><span class="muted" style="font-size:13px">${esc(r.sender_name)} · ${when(r.ts)}</span></div>
      ${r.text ? `<span class="msg">${esc(r.text)}</span>` : ''}${r.fight_id ? `<span class="muted">About result #${r.fight_id}</span>` : ''}</div>`).join('');
    const asked = q => { const k = q.kind === 'batch' ? q.waiting : q.kind; return k === 'mode' ? 'which mode' : k === 'who' ? 'who it was against' : 'which player they meant'; };
    const leftMin = q => Math.max(0, Math.ceil(((q.asked_at || q.ts) + D.settings.question_minutes * 60000 - D.generated) / 60000));
    if (D.pending.length) h += `<h3>Waiting for an answer</h3><p class="muted" style="margin-top:0">If they don't answer within ${D.settings.question_minutes} minutes, it moves to Flagged messages above.</p><div class="card">` + D.pending.map(q => `<div class="fight" style="grid-template-columns:1fr auto"><div><b>${esc(q.sender_name)}</b> <span class="muted">was asked ${asked(q)}</span><span class="msg">${esc(q.text)}</span></div><div class="muted num" style="font-size:13px">${leftMin(q) ? `moves in ${leftMin(q)} min` : 'moving now'}</div></div>`).join('') + `</div>`;
    const done = D.review.filter(r => r.resolved);
    if (done.length) h += `<details><summary>Sorted (${done.length})</summary><div class="card">` + done.slice(0, 50).map(r => `<div class="fight" style="grid-template-columns:1fr auto"><div>${esc(issue(r))} <span class="muted">→ ${esc(r.resolution || 'done')}</span></div><div class="muted num" style="font-size:13px">${ago(r.ts)}</div></div>`).join('') + `</div></details>`;
    if (D.log.length) h += `<details><summary>What the bot said (${D.log.length})</summary><div class="card">` + D.log.map(l => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted" style="font-size:12px">${when(l.ts)}${l.sent ? '' : l.error ? ' · failed to send' : ' · not sent (test mode)'}</span><span class="msg">${esc(l.text)}</span></div>`).join('') + `</div></details>`;
    h += `<p class="muted">Fixes are made by ${esc(D.admin)}. Players with a problem should message him.</p>`;
    return h;
  },
};

function render() {
  const nav = TABS.map(([k, label, icon]) =>
    `<button class="nv ${k === tab ? 'on' : ''}" data-tab="${k}">${ic(icon)}${label}${k === 'review' && openReview() ? `<span class="badge">${openReview()}</span>` : ''}</button>`);
  document.getElementById('tabs').innerHTML = `<div class="navrow"><div class="grp">Ladder</div>${nav.slice(0, 3).join('')}<div class="grp">Help</div>${nav.slice(3).join('')}</div>`;
  const view = views[tab]();
  document.getElementById('view').innerHTML = ['help', 'review'].includes(tab) ? `<h1>${TABS.find(t => t[0] === tab)[1]}</h1><div style="height:18px"></div>${view}` : view;
  const M = D.meta || {};
  const upd = `${M.group ? M.group + ' · ' : ''}Updated ${ago(D.generated)}`;
  document.getElementById('updated').textContent = upd;
  document.getElementById('updated-m').textContent = `Updated ${ago(D.generated)}`;
  let b = '';
  if (M.status === 'login_failed') b += `<div class="banner red">The bot's PlayStation login has expired, so new results aren't being read. They'll be picked up once it's renewed.</div>`;
  else if (M.login_days_left != null && M.login_days_left < 7) b += `<div class="banner amber">The bot's login needs renewing in ${Math.max(0, Math.round(M.login_days_left))} days.</div>`;
  if (M.dry_run) b += `<div class="banner amber">Test mode: the bot is reading the chat but not replying yet.</div>`;
  document.getElementById('banners').innerHTML = b;
  document.querySelector('.navrow .on')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'), m = e.target.closest('[data-mode]'), fm = e.target.closest('[data-fmode]'), f = e.target.closest('[data-fighter]');
  if (t) { tab = t.dataset.tab; window.scrollTo(0, 0); store.set('tab', tab); history.replaceState(null, '', '#' + tab); }
  else if (m) { mode = m.dataset.mode; store.set('mode', mode); }
  else if (fm) { fmode = fm.dataset.fmode; }
  else if (f) { fighter = f.dataset.fighter; tab = 'fighters'; history.replaceState(null, '', '#fighters'); window.scrollTo(0, 0); }
  else return;
  render();
});
document.addEventListener('change', e => { if (e.target.id === 'pick') { fighter = e.target.value; render(); } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) { tab = h; render(); } });
render();
</script>
</body>
</html>
