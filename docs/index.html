:root {

* { box-sizing: border-box; }

.seg { display: inline-flex; background: var(--panel-2); border-radius: 10px; padding: 3px; margin-bottom: 14px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font: 600 12px Inter, sans-serif; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.rank { font: 800 22px "Barlow Condensed", sans-serif; width: 42px; color: var(--muted); }
.rank.top { color: var(--ink); }
.name { font-weight: 600; cursor: pointer; }
.name:hover { color: var(--red); }
.rating { font: 700 20px "Barlow Condensed", sans-serif; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.up { color: var(--green); } .down { color: var(--red); }
.muted { color: var(--muted); }
.fight { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fight:last-child { border-bottom: 0; }
.fid { font: 700 15px "Barlow Condensed", sans-serif; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font: 800 24px "Barlow Condensed", sans-serif; }
.stat span { font-size: 12px; color: var(--muted); }
select { font: 600 15px Inter, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 100%; }
code, .msg { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel-2); padding: 2px 6px; border-radius: 5px; }
.msg { display: block; padding: 8px 10px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
.examples { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; align-items: center; }
.examples div:nth-child(odd) code { font-size: 14px; }
.tut p, .tut li { max-width: 68ch; }
.tut li { margin: 4px 0; }
.banner { border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; font-weight: 500; }
.banner.amber { background: var(--amber-soft); color: var(--amber); }
.banner.red { background: var(--red-soft); color: var(--red); }
.empty { color: var(--muted); padding: 14px 0; }
details summary { cursor: pointer; color: var(--muted); font-weight: 600; margin: 10px 0; }
.newhere { background: none; border: 0; padding: 0; color: var(--red); font: 600 14px Inter, sans-serif; cursor: pointer; }
@media (max-width: 560px) {
  .hide-sm { display: none; }
  h1 { font-size: 32px; }
  .examples { grid-template-columns: 1fr; }
  .examples div:nth-child(even) { margin-bottom: 8px; }
  td, th { padding: 9px 5px; }
}
</style>

const D = JSON.parse(document.getElementById('ladder-data').textContent);
const MODES = ['mma', 'sb'];
const TABS = [['rank', 'Rankings'], ['fights', 'Fights'], ['fighters', 'Fighters'], ['help', 'How to use'], ['review', 'Needs review']];
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let fighter = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = ts => {
  if (!ts) return '';
  const m = Math.round((D.generated - ts) / 60000);
  if (m < 60) return m <= 1 ? 'just now' : `${m} min ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h}h ago`;
  const d = Math.round(h / 24); if (d < 30) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
};
const when = ts => ts ? new Date(ts).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
const signed = n => n > 0 ? `<span class="up">+${n}</span>` : n < 0 ? `<span class="down">−${-n}</span>` : '<span class="muted">±0</span>';
const streak = s => s > 1 ? `<span class="pill green">W${s}</span>` : s < -1 ? `<span class="pill red">L${-s}</span>` : '';
const nameLink = (id, name) => `<span class="name" data-fighter="${esc(id)}">${esc(name)}</span>`;
const openReview = () => D.review.filter(r => !r.resolved).length + D.fights.filter(f => f.status === 'disputed').length;

function modeSeg() {
  return `<div class="seg">${MODES.map(m => `<button data-mode="${m}" class="${m === mode ? 'on' : ''}">${esc(D.modes[m].label)}</button>`).join('')}</div>`;
}
function fightRow(f) {
  const ch = (D.modes[f.mode].changes || {})[f.id];
  const score = f.score ? ` ${f.score[0]}–${f.score[1]}` : '';
  const how = '';
  const status = f.status === 'disputed' ? ' <span class="pill amber">paused</span>' : f.status === 'void' ? ' <span class="pill">removed</span>' : '';
  const deltas = ch && f.status === 'ok' ? `<span class="hide-sm">${signed(ch[0])} / ${signed(ch[1])}</span>` : '';
  return `<div class="fight"><span class="fid">#${f.id}</span>
    <div><span class="pill ${f.mode === 'mma' ? 'red' : 'gold'}">${f.mode === 'mma' ? 'MMA' : 'S&amp;B'}</span>
      ${nameLink(f.winner, f.winner_name)} <span class="muted">def.</span> ${nameLink(f.loser, f.loser_name)}${esc(score)}${how}${status}</div>
    <div class="num muted" style="font-size:13px">${deltas}<br>${ago(f.ts)}</div></div>`;
}

const views = {
  rank() {
    const M = D.modes[mode];
    const ranked = M.players.filter(p => p.rank);
    const prov = M.players.filter(p => p.provisional);
    let h = modeSeg();
    h += `<div class="card">` + (ranked.length ? `<table><thead><tr><th>#</th><th>Fighter</th><th class="num">Rating</th><th class="num">W–L</th><th class="hide-sm"></th><th class="num hide-sm">Last fight</th></tr></thead><tbody>` +
      ranked.map(p => `<tr><td class="rank ${p.rank <= 3 ? 'top' : ''}">${p.rank}</td>
        <td>${nameLink(p.id, p.name)}</td>
        <td class="num rating">${p.rating}</td><td class="num">${p.wins}–${p.losses}</td>
        <td class="hide-sm">${streak(p.streak)}</td><td class="num muted hide-sm">${ago(p.last)}</td></tr>`).join('') + `</tbody></table>`
      : `<div class="empty">Nobody is ranked in ${esc(M.label)} yet. You need ${D.settings.provisional} fights to show up here.</div>`) + `</div>`;
    if (prov.length) h += `<h3>Provisional</h3><p class="muted" style="margin-top:0">Still settling in. Ranked after ${D.settings.provisional} fights.</p><div class="card"><table><tbody>` +
      prov.map(p => `<tr><td>${nameLink(p.id, p.name)}</td><td class="num">${p.rating}</td><td class="num">${p.wins}–${p.losses}</td><td class="num muted">${p.fights}/${D.settings.provisional} fights</td></tr>`).join('') + `</tbody></table></div>`;
    const played = new Set(M.players.map(p => p.id));

        `<tr><td>${nameLink(o, D.players[o])}</td><td class="num"><b>${r[0]}–${r[1]}</b></td><td class="num">${r[0] > r[1] ? '<span class="pill green">ahead</span>' : r[0] < r[1] ? '<span class="pill red">behind</span>' : '<span class="pill">even</span>'}</td></tr>`).join('') + `</tbody></table></div>`;

    if (mine.length) h += `<h3>Recent fights</h3><div class="card">${mine.map(fightRow).join('')}</div>`;
    return h;
  },
  help() {
    const bot = D.bot_name ? `<b>${esc(D.bot_name)}</b>` : 'the bot';
    return `<div class="tut">
      <p>${bot} sits in the group chat and keeps two separate ladders: <b>MMA</b> and <b>Stand &amp; Bang</b>. It reads the chat every few seconds and replies straight away.</p>
      <h2>Posting a result</h2>
      <p>After you play, either fighter posts the result in the group chat. Write it however you like. These all work:</p>
      <div class="card examples">
        <div><code>beat bjkid 2-1 mma</code></div><div class="muted">You beat BJkid2000 two fights to one in MMA</div>
        <div><code>lost to temp sb</code></div><div class="muted">Temp beat you in Stand &amp; Bang</div>
        <div><code>jono beat bjkid 2-0 stand and bang</code></div><div class="muted">Posting for two other people</div>
        <div><code>w vs reaper mma</code></div><div class="muted">Single fight (no score means one fight)</div>
        <div><code>gg bjkid, lost 1-2 mma</code></div><div class="muted">BJkid2000 won 2–1</div>
      </div>
      <ul>
        <li><b>Names:</b> part of someone's PSN name is enough, and spelling doesn't need to be perfect. <code>bjkid</code> finds BJkid2000.</li>
        <li><b>Best of three:</b> post it <b>once</b> with the score, like <code>2-1</code>. Every fight in the set counts toward ratings, so a 2–0 is worth more than a 2–1. No score means a single fight.</li>
        <li><b>Mode:</b> add <code>mma</code> or <code>snb</code> (<code>sb</code>, <code>s&amp;b</code> and <code>stand and bang</code> also work). Leave it out and the bot uses whatever you two played last that session, or asks.</li>
        <li><b>Both posted it?</b> No problem. If you and your opponent both post the same result within ${D.settings.duplicate_minutes} minutes, it only counts once.</li>
      </ul>
      <p>Within a few seconds the bot replies with a result number and both players' new ratings, so you can check it understood you:</p>
      <span class="msg">✅ #14 MMA · JonoTheGoat def. BJkid2000 2–1 · JonoTheGoat 1612 (+14) · BJkid2000 1540 (−14)</span>
      <p><b>No confirmation within a minute? Your result didn't go through.</b> Check how you wrote it (a win or loss word, their name, and mma or snb) and post it again.</p>
      <p>If it can't tell which person you meant, it asks <i>"Which one did you mean? 1) … 2) …"</i>. Reply with the number. If it needs the mode, reply <code>mma</code> or <code>sb</code>.</p>
      <h2>Questions or problems</h2>
      <p>If the bot got a result wrong, or you have any questions or issues, <b>message ${esc(D.admin)}</b> on PlayStation and he'll sort it out.</p>
      <h2>Checking your stats in the chat</h2>
      <div class="card examples">
        <div><code>!board</code></div><div class="muted">Full rankings in both modes. <code>!board mma</code> for just MMA.</div>
        <div><code>!rank</code></div><div class="muted">Your rank, rating and record. <code>!rank bjkid</code> for someone else.</div>
        <div><code>!record bjkid</code></div><div class="muted">Your record against BJkid2000.</div>
        <div><code>!recent</code></div><div class="muted">Last 5 results</div>
        <div><code>!help</code></div><div class="muted">Quick reminder and a link to this page</div>
      </div>
      <p>This website has the full picture: rankings, every fight and each fighter's head-to-head records. Tap any name.</p>
      <h2>How the rankings work</h2>
      <ul>
        <li>Everyone starts at <b>1500</b>. Beating someone rated higher gains you more; losing to someone rated lower costs more.</li>
        <li>New players' ratings move fast at first, then settle. You appear on the board after <b>${D.settings.provisional} fights</b>.</li>
        <li>Every fight in a set counts on its own. So winning 2–1 against someone rated far below you can still cost a few points, because the fight you dropped was an upset.</li>
        <li>MMA and Stand &amp; Bang are completely separate, each with its own ratings and board.</li>
        <li>The system is called Glicko-2, a version of the Elo chess rating that also tracks how sure it is about each player.</li>
      </ul>
    </div>`;
  },
  review() {
    const M = D.meta || {};
    let h = '';
    const days = M.login_days_left;
    h += `<h2 style="margin-top:0">Bot status</h2><div class="card"><table><tbody>
      <tr><td>Last checked the chat</td><td class="num">${M.last_run ? ago(M.last_run) : 'never'}</td></tr>
      <tr><td>Posting in chat</td><td class="num">${M.dry_run ? '<span class="pill amber">Test mode, not posting</span>' : '<span class="pill green">On</span>'}</td></tr>
      <tr><td>PlayStation login</td><td class="num">${M.status === 'login_failed' ? '<span class="pill red">Expired</span>' : days != null ? `${Math.max(0, Math.round(days))} days left` : '–'}</td></tr>
      ${M.status === 'error' ? `<tr><td>Last error</td><td class="num"><span class="pill red">${esc(M.error)}</span></td></tr>` : ''}
    </tbody></table></div>`;
    const open = D.review.filter(r => !r.resolved);
    const disputed = D.fights.filter(f => f.status === 'disputed');
    h += `<h2>Needs review</h2>`;
    if (!open.length && !disputed.length) h += `<div class="card empty">Nothing to check. 👌</div>`;
    if (disputed.length) h += `<h3>Paused results</h3><div class="card">${disputed.map(fightRow).join('')}</div>`;
    if (open.length) h += `<h3>Flagged messages</h3>` + open.map(r => `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>R${r.id} · ${esc(r.reason)}</b><span class="muted" style="font-size:13px">${esc(r.sender_name)} · ${when(r.ts)}</span></div>
      ${r.text ? `<span class="msg">${esc(r.text)}</span>` : ''}${r.fight_id ? `<span class="muted">About result #${r.fight_id}</span>` : ''}</div>`).join('');
    if (D.pending.length) h += `<h3>Waiting for an answer</h3><div class="card">` + D.pending.map(q => `<div class="fight" style="grid-template-columns:1fr auto"><div><b>${esc(q.sender_name)}</b> <span class="muted">was asked ${q.kind === 'mode' ? 'which mode' : 'which player they meant'}</span><span class="msg">${esc(q.text)}</span></div><div class="muted num" style="font-size:13px">${ago(q.ts)}</div></div>`).join('') + `</div>`;
    const done = D.review.filter(r => r.resolved);
    if (done.length) h += `<details><summary>Sorted (${done.length})</summary><div class="card">` + done.slice(0, 50).map(r => `<div class="fight" style="grid-template-columns:1fr auto"><div>R${r.id} · ${esc(r.reason)} <span class="muted">→ ${esc(r.resolution || 'done')}</span></div><div class="muted num" style="font-size:13px">${ago(r.ts)}</div></div>`).join('') + `</div></details>`;
    if (D.log.length) h += `<details><summary>What the bot said (${D.log.length})</summary><div class="card">` + D.log.map(l => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted" style="font-size:12px">${when(l.ts)}${l.sent ? '' : ' · not sent (test mode)'}</span><span class="msg">${esc(l.text)}</span></div>`).join('') + `</div></details>`;
    h += `<p class="muted">Fixes are made by ${esc(D.admin)}. Players with a problem should message him.</p>`;
    return h;
  },
};

function render() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, label]) =>
    `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${label}${k === 'review' && openReview() ? `<span class="badge">${openReview()}</span>` : ''}</button>`).join('');
  document.getElementById('view').innerHTML = views[tab]();
  const M = D.meta || {};
  document.getElementById('updated').textContent = `${D.meta.group ? D.meta.group + ' · ' : ''}Updated ${ago(D.generated)}`;
  let b = '';
  if (M.status === 'login_failed') b += `<div class="banner red">The bot's PlayStation login has expired, so new results aren't being read. They'll be picked up once it's renewed.</div>`;
  else if (M.login_days_left != null && M.login_days_left < 7) b += `<div class="banner amber">The bot's login needs renewing in ${Math.max(0, Math.round(M.login_days_left))} days.</div>`;
  if (M.dry_run) b += `<div class="banner amber">Test mode: the bot is reading the chat but not replying yet.</div>`;
  document.getElementById('banners').innerHTML = b;
  document.querySelector('nav .on')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'), m = e.target.closest('[data-mode]'), f = e.target.closest('[data-fighter]');
  if (t) { tab = t.dataset.tab; window.scrollTo(0, 0); store.set('tab', tab); history.replaceState(null, '', '#' + tab); }
  else if (m) { mode = m.dataset.mode; store.set('mode', mode); }
  else if (f) { fighter = f.dataset.fighter; tab = 'fighters'; history.replaceState(null, '', '#fighters'); window.scrollTo(0, 0); }
  else return;
  render();
});
document.addEventListener('change', e => { if (e.target.id === 'pick') { fighter = e.target.value; render(); } });
render();
</script>
</body>
</html>
