name: Ladder bot

on:
  schedule:
    - cron: "7 * * * *"      # every hour, 7 minutes past
  workflow_dispatch:          # "Run workflow" button for a manual check
  push:
    branches: [main]
    paths: ["data/**", "ladder/**", "config.json"]

permissions:
  contents: write

concurrency:
  group: ladder
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read the chat, reply, rebuild the site
        run: python -m ladder.run
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
      - name: Save results
        if: always()
        run: |
          git config user.name "ladder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "Ladder update" -q
            git pull --rebase -q && git push -q
          fi
